name: Docs

on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'Examples/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'Examples/**'
      - 'mkdocs.yml'
      - 'requirements-docs.txt'
      - '.github/workflows/docs.yml'
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Publish this branch to the live site instead of the -dev site'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # live = main or a ticked deploy box, dev = any other branch, none = pull requests.
    env:
      TARGET: ${{ (github.ref == 'refs/heads/main' || inputs.deploy) && 'live' || (github.event_name == 'pull_request' && 'none' || 'dev') }}
    outputs:
      target: ${{ env.TARGET }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: requirements-docs.txt

      - name: Install MkDocs
        run: pip install -r requirements-docs.txt

      # --strict turns broken links and bad nav entries into a failed run on every branch.
      - name: Build site
        env:
          # mkdocs-same-dir pulls in ProperDocs, which prints a banner about MkDocs 2 on every build.
          DISABLE_MKDOCS_2_WARNING: 'true'
          SITE_URL: ${{ env.TARGET == 'dev' && 'https://brycefors.github.io/Windows-ISO-Updater-dev/' || 'https://brycefors.github.io/Windows-ISO-Updater/' }}
        run: mkdocs build --strict

      # Download from the run summary, then serve the folder (python -m http.server) to browse it.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: docs-site
          path: site/
          retention-days: 7

      - if: env.TARGET == 'live'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/

  deploy:
    needs: build
    if: needs.build.outputs.target == 'live'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job writes, so the elevated scopes stay off the build job.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Queue deployments rather than cancel one halfway through publishing.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  # Pages allows one site per repo, so the -dev site is the Pages site of a second repo.
  deploy-dev:
    needs: build
    if: needs.build.outputs.target == 'dev'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: docs-dev
      url: https://brycefors.github.io/Windows-ISO-Updater-dev/
    # There is one dev site, so the newest branch push wins.
    concurrency:
      group: pages-dev
      cancel-in-progress: true
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: docs-site
          path: site

      # One orphan commit, force-pushed, so the dev repo never accumulates build history.
      - name: Push to Windows-ISO-Updater-dev
        working-directory: site
        env:
          DEV_PAGES_TOKEN: ${{ secrets.DEV_PAGES_TOKEN }}
        run: |
          if [ -z "$DEV_PAGES_TOKEN" ]; then
            echo "::error::DEV_PAGES_TOKEN is not set. It needs Contents read and write on brycefors/Windows-ISO-Updater-dev."
            exit 1
          fi
          touch .nojekyll
          git init -q -b gh-pages
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Docs from $GITHUB_REF_NAME at $GITHUB_SHA"
          git push -q --force "https://x-access-token:${DEV_PAGES_TOKEN}@github.com/brycefors/Windows-ISO-Updater-dev.git" gh-pages
